<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="icon" href="data:,"><title>embedded player</title></head>
<body>
  <div class="player"><video id="v" src="test.mp4" width="640" height="360" muted loop></video></div>
  <script>
    // A site built on one of the common web players: its captions are a plain
    // element with that player's class name (?cls=...), not a text track
    const box = document.createElement('div');
    box.className = new URLSearchParams(location.search).get('cls');
    document.querySelector('.player').append(box);
    window.setLines = (...lines) => box.replaceChildren(...lines.map((text) => Object.assign(document.createElement('div'), { textContent: text })));
    window.hideCaptions = () => { box.style.display = 'none'; };
    window.setLines('player line one');
  </script>
</body>
</html>
